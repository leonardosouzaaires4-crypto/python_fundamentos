<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Calculadora</h1>
    <p>Bem-vindo à calculadora!</p>

    <form action="/calcular" method="POST">

        <label for="operacao">Escolha a operação:</label>

        <select id="operacao" name="operacao">

            <option value="soma" {% if operacao=='soma' %}selected{% endif %}>
                Soma
            </option>

            <option value="subtracao" {% if operacao=='subtracao' %}selected{% endif %}>
                Subtração
            </option>

            <option value="multiplicacao" {% if operacao=='multiplicacao' %}selected{% endif %}>
                Multiplicação
            </option>

            <option value="divisao" {% if operacao=='divisao' %}selected{% endif %}>
                Divisão
            </option>

        </select>

        <br><br>

        <label for="num1">Número 1:</label>
        <input type="number" id="num1" name="num1" step="any" value="{{ num1 if num1 is defined else '' }}" required>

        <br><br>

        <label for="num2">Número 2:</label>
        <input type="number" id="num2" name="num2" step="any" value="{{ num2 if num2 is defined else '' }}" required>

        <div class="botoes">

            <button type="submit" class="btn-calcular">
                Calcular
            </button>

            <button type="button" class="btn-limpar" id="btnLimpar">
                Limpar
            </button>

        </div>

        {% if resultado is defined %}
        <div class="resultado" id="resultado">
            <span>Resultado</span>
            <h2>{{ resultado }}</h2>
        </div>
        {% endif %}

    </form>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
